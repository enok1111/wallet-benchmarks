[package]
name = "wallet-benchmarks"
version = "0.1.0"
edition = "2024"
authors = ["Tari Wallet Benchmarks"]
license = "BSD-3-Clause"
repository = "https://github.com/tari-project/wallet-benchmarks"
description = "Reproducible wallet performance test harness for Tari/Minotari"

[lib]
name = "wallet_benchmarks"
path = "src/lib.rs"

[[bin]]
name = "wallet-benchmarks"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
hex = "0.4"
log = "0.4"
log4rs = { version = "1.4", features = ["yaml_format", "console_appender"] }
rand = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.35"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tonic = "0.13"
prost = "0.13"
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

# Tari gRPC proto definitions (for old wallet communication)
minotari_app_grpc = { version = "5.3.1-pre.0", default-features = false }
tari_common = "5.3.1-pre.0"
tari_common_types = "5.3.1-pre.0"
tari_transaction_components = "5.3.1-pre.0"

# New wallet library integration
minotari = { git = "https://github.com/tari-project/minotari-cli.git", branch = "main" }
async-trait = "0.1"
env_logger = "0.11"

[profile.release]
overflow-checks = true
